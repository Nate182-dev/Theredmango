<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango Cross</title>

  <style>
    :root{
      --bg:#0b0d10;
      --panel:#111214;
      --line:rgba(255,255,255,0.08);
      --text:#fafafa;
      --muted:#dfe5ee;
      --orange:#ff8e2d;
      --gold:#ffcb65;
      --purple:#8a6df2;
      --green:#18f4a6;
      --green-2:#69d96b;
      --grass:#6bbd52;
      --road:#5f636a;
      --road1:#4a4d54;
      --road2:#34373d;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html, body{
      height:100%;
      background:#000;
      font-family:Inter, Arial, sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding:0;
    }

    .phone{
      width:100%;
      max-width:430px;
      height:100vh;
      background:#111214;
      position:relative;
      overflow:hidden;
      border-left:1px solid #000;
      border-right:1px solid #000;
    }

    .statusbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 18px 0 18px;
      height:46px;
      color:#111;
      background:#f3f3f3;
      font-weight:700;
      font-size:1.1rem;
    }

    .status-left{ letter-spacing:0.04em; }
    .status-right{ display:flex; align-items:center; gap:9px; font-size:0.8rem; }
    .signal{
      display:flex; align-items:flex-end; gap:3px; height:15px;
    }
    .signal span{
      display:block; width:4px; border-radius:2px; background:#111;
    }
    .signal span:nth-child(1){ height:5px; opacity:0.45; }
    .signal span:nth-child(2){ height:8px; opacity:0.65; }
    .signal span:nth-child(3){ height:11px; opacity:0.9; }
    .signal span:nth-child(4){ height:14px; }

    .battery{
      width:24px; height:11px; border:2px solid #111; border-radius:3px; position:relative; display:inline-block;
    }
    .battery::before{
      content:""; position:absolute; inset:2px; background:#111; border-radius:2px;
    }
    .battery::after{
      content:""; position:absolute; right:-5px; top:2px; width:2px; height:5px; background:#111; border-radius:1px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 18px 10px;
      background:#1c1d21;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .topbar-left{
      display:flex; align-items:center; gap:12px; font-weight:800;
    }

    .back-btn{
      width:34px; height:34px; border-radius:50%;
      background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1);
      display:flex; align-items:center; justify-content:center;
      text-decoration:none; color:#fff; font-size:1.5rem; font-weight:700;
    }

    .game-label{
      font-size:1.2rem; letter-spacing:0.01em;
    }

    .mini-icons{
      display:flex; align-items:center; gap:8px;
    }

    .mini-dot{
      width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.4);
    }
    .mini-dot:last-child{
      width:26px; height:10px; border-radius:999px; background:rgba(255,255,255,0.4);
    }

    .game-area{
      position:relative;
      width:100%;
      height:520px;
      overflow:hidden;
      background:linear-gradient(180deg, #a9d4ff 0%, #d7efff 35%, #bdf0c4 100%);
      border-bottom:1px solid rgba(0,0,0,0.15);
    }

    canvas{
      width:100%;
      height:100%;
      display:block;
      touch-action:manipulation;
      background:linear-gradient(180deg, #9ccaf5 0%, #d2f3ff 22%, #bce8c0 100%);
    }

    .hud{
      position:absolute;
      inset:0 0 auto 0;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:14px 16px 0;
      pointer-events:none;
      z-index:3;
      font-weight:900;
      text-shadow:0 2px 0 rgba(0,0,0,0.18);
    }

    .score-box{
      background:rgba(0,0,0,0.12);
      border-radius:10px;
      padding:8px 10px;
      color:#ffffff;
    }

    .score-box strong{
      font-size:1.5rem;
      display:inline-block;
      color:#ecffee;
    }

    .best-box{
      background:rgba(0,0,0,0.12);
      border-radius:10px;
      padding:8px 10px;
      color:#fff;
    }

    .best-box span{
      color:#7ef6bf;
      font-size:1.3rem;
      font-weight:900;
    }

    .controls{
      padding:10px 16px 18px;
      background:#111214;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:18px 18px;
      color:white;
      font-weight:900;
      cursor:pointer;
      font-size:1.05rem;
      transition:transform 0.1s ease, filter 0.1s ease;
      touch-action:manipulation;
    }

    .btn:active{ transform:scale(0.99); filter:brightness(0.98); }

    .start-btn{
      background:linear-gradient(90deg, var(--orange), var(--gold));
      box-shadow:0 12px 28px rgba(255,146,42,0.25);
      margin-bottom:12px;
    }

    .restart-btn{
      background:linear-gradient(90deg, var(--purple), var(--green));
      box-shadow:0 12px 28px rgba(120,113,234,0.22);
    }

    .secondary-row{
      display:flex; gap:10px; margin-top:10px;
    }

    .secondary-link{
      flex:1; display:block; text-align:center; text-decoration:none;
      border-radius:14px; padding:14px 16px; font-weight:800; color:#fff;
      border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04);
    }

    .donate-link{
      display:block; margin:8px 16px 18px; padding:15px 18px;
      border-radius:16px; text-align:center; text-decoration:none;
      font-weight:900; color:#fff; background:linear-gradient(90deg, #7f61ef, #4ad9b2);
      box-shadow:0 12px 22px rgba(35,36,42,0.25);
    }

    @media (max-width:430px){
      .game-area{ height:500px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <div class="status-left">15:07</div>
      <div class="status-right">
        <div class="signal">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="battery"></div>
      </div>
    </div>

    <div class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="index.html" aria-label="Back home">‹</a>
        <div class="game-label">Mango Cross</div>
      </div>

      <div class="mini-icons">
        <div class="mini-dot"></div>
        <div class="mini-dot"></div>
      </div>
    </div>

    <div class="game-area">
      <div class="hud">
        <div class="score-box">Score: <strong id="scoreValue">0</strong></div>
        <div class="best-box">High: <span id="bestValue">0</span></div>
      </div>

      <canvas id="gameCanvas" width="430" height="520"></canvas>
    </div>

    <div class="controls">
      <button class="btn start-btn" id="startBtn">Start</button>
      <button class="btn restart-btn" id="restartBtn">Restart</button>

      <div class="secondary-row">
        <a href="game.html" class="secondary-link">Mango Bird</a>
        <a href="index.html" class="secondary-link">Home</a>
      </div>
    </div>

    <a class="donate-link" href="index.html#wallet">💚 Donate SOL</a>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreValue = document.getElementById("scoreValue");
    const bestValue = document.getElementById("bestValue");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const HIGH_KEY = "mangoCrossHigh";
    const bestSaved = Number(localStorage.getItem(HIGH_KEY)) || 0;
    bestValue.textContent = bestSaved;

    const GRID_COLS = 5;
    const GRID_ROWS = 7;
    const TILE = 58;

    const state = {
      running: false,
      over: false,
      score: 0,
      best: bestSaved,
      playerX: 2,
      playerY: 6,
      moveCooldown: 0,
      holdMode: false,
      holdTimer: 0,
      obstacles: [],
      speed: 1,
      rowsPassed: 0,
      lastStepAt: 0
    };

    function resetGame() {
      state.running = false;
      state.over = false;
      state.score = 0;
      state.playerX = 2;
      state.playerY = 6;
      state.moveCooldown = 0;
      state.holdMode = false;
      state.holdTimer = 0;
      state.obstacles = [];
      state.speed = 1;
      state.rowsPassed = 0;
      state.lastStepAt = 0;
      scoreValue.textContent = "0";
      generateObstacles();
    }

    function updateBest() {
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(HIGH_KEY, String(state.best));
        bestValue.textContent = state.best;
      }
    }

    function movePlayer(dx, dy) {
      if (state.over) return;

      if (!state.running) {
        state.running = true;
      }

      if (dx !== 0) {
        state.playerX = Math.max(0, Math.min(GRID_COLS - 1, state.playerX + dx));
      }

      if (dy !== 0) {
        state.playerY = Math.max(0, Math.min(GRID_ROWS - 1, state.playerY + dy));
      }

      if (state.playerY === 0) {
        state.score += 1;
        scoreValue.textContent = state.score;
        state.playerY = GRID_ROWS - 1;
        state.speed += 0.18;
        updateBest();
      }
    }

    function generateObstacles() {
      state.obstacles = [];

      for (let y = 0; y < GRID_ROWS; y++) {
        const chance = y === 6 ? 0 : 0.8;
        if (Math.random() < chance) {
          const laneCount = Math.floor(Math.random() * 3) + 1;
          for (let i = 0; i < laneCount; i++) {
            const lane = Math.floor(Math.random() * GRID_COLS);
            const speed = (Math.random() * 1.2 + 0.8) * state.speed;
            state.obstacles.push({
              lane,
              row: y,
              x: Math.random() * (canvas.width - 120),
              w: 42 + Math.random() * 28,
              h: 26,
              dir: Math.random() > 0.5 ? 1 : -1,
              speed,
              color: i % 2 === 0 ? "#ff6b57" : "#7d6ef6"
            });
          }
        }
      }
    }

    function updateObstacles() {
      if (!state.running) return;

      for (const o of state.obstacles) {
        o.x += o.dir * o.speed * 2.3;

        if (o.x < -80) {
          o.x = canvas.width + 80;
          o.dir *= -1;
        }

        if (o.x > canvas.width + 80) {
          o.x = -80;
          o.dir *= -1;
        }
      }

      for (const o of state.obstacles) {
        const playerPx = state.playerX * TILE + 36;
        const playerPy = state.playerY * TILE + 34;

        const objX = o.x;
        const objY = o.row * TILE + 48;

        const collision =
          playerPx > objX - 24 &&
          playerPx < objX + o.w + 24 &&
          playerPy > objY - 22 &&
          playerPy < objY + o.h + 22;

        if (collision) {
          state.over = true;
          state.running = false;
          updateBest();
          return;
        }
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#9fcdf9");
      sky.addColorStop(0.55, "#d8f2ff");
      sky.addColorStop(1, "#bff0c7");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#7bcf61";
      ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

      ctx.fillStyle = "#6e787f";
      ctx.fillRect(0, 0, canvas.width, canvas.height - 70);

      ctx.fillStyle = "#b0b4bc";
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(i * 55 + 10, 0, 8, canvas.height - 70);
      }

      for (let row = 0; row <= GRID_ROWS; row++) {
        const y = row * TILE + 10;
        ctx.fillStyle = row % 2 === 0 ? "rgba(255,255,255,0.2)" : "rgba(0,0,0,0.08)";
        ctx.fillRect(0, y, canvas.width, 2);
      }

      ctx.fillStyle = "#4dba46";
      ctx.fillRect(0, canvas.height - 70, canvas.width, 8);

      for (let i = 0; i < GRID_COLS; i++) {
        const x = i * TILE + 12;
        ctx.fillStyle = "rgba(255,255,255,0.08)";
        ctx.fillRect(x, 0, 2, canvas.height - 70);
      }
    }

    function drawPlayer() {
      const x = state.playerX * TILE + 30;
      const y = state.playerY * TILE + 28;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#ff8a2f";
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffd18c";
      ctx.beginPath();
      ctx.arc(-5, -5, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(6, -4, 2.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff5d00";
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(21, 2);
      ctx.lineTo(12, 7);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#20d17a";
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.quadraticCurveTo(-4, -17, 4, -11);
      ctx.quadraticCurveTo(-4, -3, -12, -10);
      ctx.fill();

      ctx.fillStyle = "#ffb451";
      ctx.beginPath();
      ctx.ellipse(-12, 7, 11, 8, -0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff9d32";
      ctx.beginPath();
      ctx.ellipse(7, 10, 12, 9, 0.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawObstacles() {
      for (const o of state.obstacles) {
        const x = o.x;
        const y = o.row * TILE + 40;

        ctx.fillStyle = o.color;
        ctx.fillRect(x, y, o.w, o.h);

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x + 7, y + 5, o.w - 14, 6);

        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.fillRect(x + o.w - 7, y, 7, o.h);
      }
    }

    function drawStartText() {
      if (state.running || state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "900 28px Arial";
      ctx.fillText("Mango Cross", canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = "700 18px Arial";
      ctx.fillText("Swipe/hold to move", canvas.width / 2, canvas.height / 2 + 20);
    }

    function drawGameOver() {
      if (!state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "900 28px Arial";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 12);

      ctx.font = "700 18px Arial";
      ctx.fillText("Score: " + state.score, canvas.width / 2, canvas.height / 2 + 24);
      ctx.fillText("Best: " + state.best, canvas.width / 2, canvas.height / 2 + 52);
    }

    function render() {
      drawBackground();
      drawObstacles();
      drawPlayer();
      drawStartText();
      drawGameOver();
    }

    function gameLoop() {
      updateObstacles();
      render();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      resetGame();
      state.running = true;
    }

    let pointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let holdLoop = null;

    function triggerHoldMove() {
      if (!state.running || state.over) return;
      movePlayer(0, -1);
    }

    canvas.addEventListener("pointerdown", (e) => {
      pointerDown = true;
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;

      if (!state.running && !state.over) {
        startGame();
        return;
      }

      holdLoop = setInterval(() => {
        if (pointerDown && state.running && !state.over) {
          triggerHoldMove();
        }
      }, 170);
    });

    canvas.addEventListener("pointerup", () => {
      pointerDown = false;
      clearInterval(holdLoop);
    });

    canvas.addEventListener("pointerleave", () => {
      pointerDown = false;
      clearInterval(holdLoop);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!pointerDown) return;

      const dx = e.clientX - pointerStartX;
      const dy = e.clientY - pointerStartY;

      if (Math.abs(dx) > 28 || Math.abs(dy) > 28) {
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) movePlayer(1, 0);
          else movePlayer(-1, 0);
        } else {
          if (dy < 0) movePlayer(0, -1);
        }

        pointerDown = false;
        clearInterval(holdLoop);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft") movePlayer(-1, 0);
      else if (e.code === "ArrowRight") movePlayer(1, 0);
      else if (e.code === "ArrowUp") movePlayer(0, -1);
      else if (e.code === "Space") {
        if (!state.running && !state.over) {
          startGame();
        } else if (!state.over) {
          movePlayer(0, -1);
        }
      }
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);

    resetGame();
    generateObstacles();
    gameLoop();
  </script>
</body>
</html>
