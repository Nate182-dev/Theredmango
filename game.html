<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango Bird</title>

  <style>
    :root{
      --bg:#0b0d10;
      --panel:#111214;
      --panel-2:#17191d;
      --line:rgba(255,255,255,0.08);
      --text:#ffffff;
      --muted:#dfe5ee;
      --orange:#ff8e2d;
      --gold:#ffcb65;
      --green:#78d75f;
      --green-2:#5abf3b;
      --purple:#8a6df2;
      --green-3:#18f4a6;
      --sky1:#8dd8e8;
      --sky2:#c7f3ff;
      --ground:#8edd5d;
      --grass:#69bb3c;
      --shadow:rgba(0,0,0,0.35);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html, body{
      height:100%;
      background:#000;
      font-family:Inter, Arial, sans-serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      overflow:hidden;
    }

    .phone{
      width:100%;
      max-width:430px;
      height:100vh;
      background:#111214;
      position:relative;
      overflow:hidden;
      border-left:1px solid #000;
      border-right:1px solid #000;
    }

    .statusbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 18px 0 18px;
      height:46px;
      color:#111;
      background:#f3f3f3;
      font-weight:700;
      font-size:1.1rem;
    }

    .status-left{
      letter-spacing:0.04em;
    }

    .status-right{
      display:flex;
      align-items:center;
      gap:9px;
      font-size:0.8rem;
    }

    .signal{
      display:flex;
      align-items:flex-end;
      gap:3px;
      height:15px;
    }

    .signal span{
      display:block;
      width:4px;
      border-radius:2px;
      background:#111;
    }

    .signal span:nth-child(1){ height:5px; opacity:0.45; }
    .signal span:nth-child(2){ height:8px; opacity:0.65; }
    .signal span:nth-child(3){ height:11px; opacity:0.85; }
    .signal span:nth-child(4){ height:14px; }

    .battery{
      width:24px;
      height:11px;
      border:2px solid #111;
      border-radius:3px;
      position:relative;
      display:inline-block;
    }
    .battery::before{
      content:"";
      position:absolute;
      inset:2px;
      background:#111;
      border-radius:2px;
    }
    .battery::after{
      content:"";
      position:absolute;
      right:-5px;
      top:2px;
      width:2px;
      height:5px;
      background:#111;
      border-radius:1px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#1c1d21;
      padding:14px 18px 10px;
      color:#f5f5f5;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    .topbar-left{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
    }

    .back-btn{
      width:34px;
      height:34px;
      border-radius:50%;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:1.5rem;
      font-weight:700;
      text-decoration:none;
    }

    .game-label{
      font-size:1.2rem;
      letter-spacing:0.01em;
    }

    .mini-icons{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .mini-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:rgba(255,255,255,0.4);
    }

    .mini-dot:last-child{
      width:26px;
      height:10px;
      border-radius:999px;
      background:rgba(255,255,255,0.4);
    }

    .game-area{
      position:relative;
      width:100%;
      height:520px;
      background:linear-gradient(180deg, var(--sky1), var(--sky2) 62%, #c9f2dd 62%, #a6e8ab);
      overflow:hidden;
      border-bottom:1px solid rgba(0,0,0,0.25);
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
      background:linear-gradient(180deg, var(--sky1), var(--sky2) 62%, #d1f0cc 62%, #9ed26e);
      touch-action:manipulation;
    }

    .hud{
      position:absolute;
      inset:0 0 auto 0;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding:14px 16px 0;
      pointer-events:none;
      color:#fff;
      font-weight:900;
      text-shadow:0 2px 0 rgba(0,0,0,0.25);
      z-index:3;
    }

    .score-box{
      font-size:1.05rem;
      letter-spacing:0.02em;
      color:#eafaf6;
      background:rgba(0,0,0,0.15);
      border-radius:10px;
      padding:8px 10px;
    }

    .score-box strong{
      font-size:1.5rem;
      font-weight:900;
    }

    .high-box{
      font-size:1rem;
      letter-spacing:0.02em;
      color:#ffffff;
      background:rgba(0,0,0,0.12);
      border-radius:10px;
      padding:8px 10px;
    }

    .high-box span{
      color:#7ef6bf;
      font-weight:900;
      font-size:1.3rem;
    }

    .controls{
      padding:10px 16px 18px;
      background:#111214;
    }

    .btn{
      appearance:none;
      border:none;
      cursor:pointer;
      width:100%;
      border-radius:18px;
      color:#fff;
      font-weight:900;
      font-size:1.05rem;
      padding:18px 18px;
      transition:transform 0.1s ease, filter 0.1s ease;
      touch-action:manipulation;
    }

    .btn:active{
      transform:scale(0.99);
      filter:brightness(0.98);
    }

    .start-btn{
      background:linear-gradient(90deg, var(--orange), var(--gold));
      box-shadow:0 12px 28px rgba(255,146,42,0.25);
      margin-bottom:12px;
    }

    .restart-btn{
      background:linear-gradient(90deg, var(--purple), var(--green-3));
      box-shadow:0 12px 28px rgba(120,113,234,0.22);
      margin-bottom:0;
    }

    .secondary-row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .secondary-link{
      flex:1;
      display:block;
      text-align:center;
      text-decoration:none;
      border-radius:14px;
      font-weight:800;
      color:#fff;
      padding:14px 16px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.04);
    }

    .donate-link{
      display:block;
      margin:8px 16px 18px;
      padding:15px 18px;
      border-radius:16px;
      text-align:center;
      text-decoration:none;
      font-weight:900;
      color:#fff;
      background:linear-gradient(90deg, #7f61ef, #4ad9b2);
      box-shadow:0 12px 22px rgba(35,36,42,0.25);
    }

    @media (max-width:430px){
      .game-area{ height:500px; }
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="statusbar">
      <div class="status-left">15:07</div>
      <div class="status-right">
        <div class="signal">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="battery"></div>
      </div>
    </div>

    <div class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="index.html" aria-label="Back home">‹</a>
        <div class="game-label">Mango Bird</div>
      </div>

      <div class="mini-icons">
        <div class="mini-dot"></div>
        <div class="mini-dot"></div>
      </div>
    </div>

    <div class="game-area">
      <div class="hud">
        <div class="score-box">Score: <strong id="scoreValue">0</strong></div>
        <div class="high-box">High: <span id="bestValue">0</span></div>
      </div>

      <canvas id="gameCanvas" width="430" height="520"></canvas>
    </div>

    <div class="controls">
      <button class="btn start-btn" id="startBtn">Start</button>
      <button class="btn restart-btn" id="restartBtn">Restart</button>

      <div class="secondary-row">
        <a href="crossy.html" class="secondary-link">Crossy</a>
        <a href="index.html" class="secondary-link">Home</a>
      </div>
    </div>

    <a class="donate-link" href="index.html#wallet">💚 Donate SOL</a>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreValue = document.getElementById("scoreValue");
    const bestValue = document.getElementById("bestValue");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const HIGH_SCORE_KEY = "mangoBirdHighScore";
    const storedHigh = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    bestValue.textContent = storedHigh;

    const state = {
      running: false,
      over: false,
      score: 0,
      best: storedHigh,
      gravity: 0.62,
      lift: -8.9,
      birdX: 110,
      birdY: 220,
      birdRadius: 16,
      velocity: 0,
      pipeWidth: 62,
      pipeGap: 150,
      pipeSpeed: 3.25,
      spawnTimer: 0,
      pipes: [],
      hazardBirds: [],
      cloudOffset: 0,
      groundY: canvas.height - 46
    };

    function updateBest() {
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(HIGH_SCORE_KEY, String(state.best));
        bestValue.textContent = state.best;
      }
    }

    function resetGame() {
      state.running = false;
      state.over = false;
      state.score = 0;
      state.birdY = 220;
      state.velocity = 0;
      state.pipes = [];
      state.hazardBirds = [];
      state.spawnTimer = 0;
      state.cloudOffset = 0;
      scoreValue.textContent = "0";
      state.pipeSpeed = 3.25;
    }

    function flap() {
      if (state.over) return;

      if (!state.running) {
        state.running = true;
      }

      state.velocity = state.lift;
    }

    function startAndFly() {
      resetGame();
      state.running = true;
      flap();
    }

    function createPipe() {
      const minTop = 50;
      const maxTop = state.groundY - state.pipeGap - 90;
      const topHeight = minTop + Math.random() * (maxTop - minTop);

      const patternRoll = Math.random();

      if (patternRoll > 0.7 && state.score > 6) {
        const tighterGap = Math.max(90, state.pipeGap - 10);
        state.pipes.push({
          x: canvas.width + 30,
          w: state.pipeWidth,
          gap: tighterGap,
          topHeight,
          passed: false,
          type: "tight"
        });
      } else if (patternRoll > 0.45 && state.score > 12) {
        state.pipes.push({
          x: canvas.width + 30,
          w: state.pipeWidth,
          gap: Math.max(86, state.pipeGap - 25),
          topHeight: topHeight + 25,
          passed: false,
          type: "low"
        });
      } else {
        state.pipes.push({
          x: canvas.width + 30,
          w: state.pipeWidth,
          gap: state.pipeGap,
          topHeight,
          passed: false,
          type: "normal"
        });
      }

      if (state.score > 14 && Math.random() > 0.7) {
        state.hazardBirds.push({
          x: canvas.width + 30,
          y: Math.random() * (state.groundY - 140) + 50,
          w: 18,
          h: 12,
          dir: -1,
          speed: 3.5 + state.score * 0.1
        });
      }

      if (state.score > 20 && Math.random() > 0.75) {
        state.pipes.push({
          x: canvas.width + 80,
          w: state.pipeWidth - 10,
          gap: Math.max(72, state.pipeGap - 40),
          topHeight: topHeight + 20,
          passed: false,
          type: "extra"
        });
      }
    }

    function updateGame() {
      if (!state.running || state.over) return;

      state.velocity += state.gravity;
      state.birdY += state.velocity;

      const scoreFactor = Math.min(9.5, 3.25 + state.score * 0.28);
      state.pipeSpeed = scoreFactor;

      if (state.score >= 10) {
        state.gravity = 0.68;
        state.lift = -9.1;
      }

      if (state.score >= 20) {
        state.gravity = 0.76;
        state.lift = -9.6;
      }

      state.spawnTimer += 1;
      const spawnRate = Math.max(46, 80 - state.score * 1.2);
      if (state.spawnTimer >= spawnRate) {
        createPipe();
        state.spawnTimer = 0;
      }

      for (const pipe of state.pipes) {
        pipe.x -= state.pipeSpeed;

        if (!pipe.passed && pipe.x + pipe.w < state.birdX) {
          pipe.passed = true;
          state.score += 1;
          scoreValue.textContent = state.score;
          updateBest();
        }
      }

      for (const bird of state.hazardBirds) {
        bird.x += bird.dir * bird.speed;
      }

      state.pipes = state.pipes.filter(pipe => pipe.x + pipe.w > -10);
      state.hazardBirds = state.hazardBirds.filter(bird => bird.x > -50);

      const birdLeft = state.birdX - state.birdRadius;
      const birdRight = state.birdX + state.birdRadius;
      const birdTop = state.birdY - state.birdRadius;
      const birdBottom = state.birdY + state.birdRadius;

      for (const pipe of state.pipes) {
        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipe.w;
        const topBottom = pipe.topHeight;
        const bottomTop = pipe.topHeight + pipe.gap;

        const hitsX = birdRight > pipeLeft && birdLeft < pipeRight;
        const hitsTop = birdTop < topBottom;
        const hitsBottom = birdBottom > bottomTop;

        if (hitsX && (hitsTop || hitsBottom)) {
          state.over = true;
          state.running = false;
          updateBest();
          return;
        }
      }

      for (const bird of state.hazardBirds) {
        const birdBoxLeft = bird.x - bird.w / 2;
        const birdBoxRight = bird.x + bird.w / 2;
        const birdBoxTop = bird.y - bird.h / 2;
        const birdBoxBottom = bird.y + bird.h / 2;

        const hit =
          birdBoxRight > birdLeft &&
          birdBoxLeft < birdRight &&
          birdBoxBottom > birdTop &&
          birdBoxTop < birdBottom;

        if (hit) {
          state.over = true;
          state.running = false;
          updateBest();
          return;
        }
      }

      if (state.birdY + state.birdRadius >= state.groundY || state.birdY - state.birdRadius <= 0) {
        state.over = true;
        state.running = false;
        updateBest();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#87d5e9");
      sky.addColorStop(0.7, "#9feaf4");
      sky.addColorStop(1, "#9ae2b8");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255,255,255,0.55)";
      for (let i = 0; i < 8; i++) {
        const x = ((i * 80) - (state.cloudOffset % 80)) + 24;
        const y = 40 + (i % 3) * 26;

        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.arc(x + 18, y - 10, 20, 0, Math.PI * 2);
        ctx.arc(x + 36, y, 18, 0, Math.PI * 2);
        ctx.fill();
      }
      state.cloudOffset += 0.7;

      ctx.fillStyle = "rgba(88,114,133,0.45)";
      const skylineY = 300;
      for (let i = 0; i < 18; i++) {
        const x = i * 26;
        const h = 30 + ((i % 5) * 10);
        ctx.fillRect(x, skylineY - h, 18, h);
      }

      ctx.fillStyle = "#86d258";
      ctx.fillRect(0, canvas.height - 46, canvas.width, 46);

      ctx.fillStyle = "#7ebd4a";
      for (let x = -15; x < canvas.width + 40; x += 24) {
        ctx.fillRect(x - (state.cloudOffset * 2 % 24), canvas.height - 28, 16, 6);
      }

      ctx.fillStyle = "#5b9f37";
      ctx.fillRect(0, canvas.height - 60, canvas.width, 14);

      ctx.fillStyle = "#72c95d";
      for (let x = -30; x < canvas.width + 50; x += 18) {
        ctx.fillRect(x - (state.cloudOffset * 2 % 18), canvas.height - 64, 11, 7);
      }
    }

    function drawPipe(pipe) {
      const topHeight = pipe.topHeight;
      const bottomY = pipe.topHeight + pipe.gap;

      ctx.fillStyle = "#6fbf45";
      ctx.fillRect(pipe.x, 0, pipe.w, topHeight);
      ctx.fillRect(pipe.x, bottomY, pipe.w, state.groundY - bottomY);

      ctx.fillStyle = "#8bdb60";
      ctx.fillRect(pipe.x + 8, 0, 7, topHeight);
      ctx.fillRect(pipe.x + 8, bottomY, 7, state.groundY - bottomY);

      ctx.fillStyle = "#5aa73e";
      ctx.fillRect(pipe.x - 8, topHeight - 18, pipe.w + 16, 18);
      ctx.fillRect(pipe.x - 8, bottomY, pipe.w + 16, 18);

      ctx.fillStyle = "#7ad15a";
      ctx.fillRect(pipe.x + 8, topHeight - 18, pipe.w - 16, 8);
      ctx.fillRect(pipe.x + 8, bottomY, pipe.w - 16, 8);

      ctx.fillStyle = "rgba(0,0,0,0.15)";
      ctx.fillRect(pipe.x + pipe.w - 8, 0, 8, topHeight);
      ctx.fillRect(pipe.x + pipe.w - 8, bottomY, 8, state.groundY - bottomY);
    }

    function drawHazardBird(bird) {
      const x = bird.x;
      const y = bird.y;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#ff5d5d";
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f2f2f2";
      ctx.beginPath();
      ctx.arc(-4, -3, 2.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.arc(-3, -3, 1.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff8b5e";
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(18, -2);
      ctx.lineTo(10, 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ff8b5e";
      ctx.beginPath();
      ctx.moveTo(-10, 2);
      ctx.lineTo(-18, 7);
      ctx.lineTo(-10, 9);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawMangoBird() {
      const x = state.birdX;
      const y = state.birdY;

      ctx.save();
      ctx.translate(x, y);

      const tilt = Math.max(-1.2, Math.min(1.2, state.velocity / 9));
      ctx.rotate(tilt);

      ctx.fillStyle = "#ff8a2f";
      ctx.beginPath();
      ctx.arc(0, 0, state.birdRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffbf6d";
      ctx.beginPath();
      ctx.arc(-6, -7, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e66d00";
      ctx.beginPath();
      ctx.ellipse(-11, 5, 14, 10, -0.75, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffb24b";
      ctx.beginPath();
      ctx.ellipse(8, 8, 12, 9, 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0d0d0d";
      ctx.beginPath();
      ctx.arc(8, -5, 3.0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ff5b00";
      ctx.beginPath();
      ctx.moveTo(17, 0);
      ctx.lineTo(28, 3);
      ctx.lineTo(17, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#20d17a";
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.quadraticCurveTo(-4, -18, 4, -13);
      ctx.quadraticCurveTo(-5, -2, -12, -10);
      ctx.fill();

      ctx.restore();
    }

    function drawEndText() {
      if (!state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "900 28px Arial";
      ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 18);

      ctx.font = "700 18px Arial";
      ctx.fillStyle = "#eaeaea";
      ctx.fillText("Score: " + state.score, canvas.width / 2, canvas.height / 2 + 18);

      ctx.fillStyle = "#ffdd8a";
      ctx.fillText("Tap or Space to retry", canvas.width / 2, canvas.height / 2 + 54);
    }

    function drawStartText() {
      if (state.running || state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.07)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 30px Arial";
      ctx.fillText("Mango Bird", canvas.width / 2, canvas.height / 2 - 12);

      ctx.font = "700 18px Arial";
      ctx.fillText("Tap or press Space to flap", canvas.width / 2, canvas.height / 2 + 22);
    }

    function render() {
      drawBackground();

      for (const pipe of state.pipes) {
        drawPipe(pipe);
      }

      for (const bird of state.hazardBirds) {
        drawHazardBird(bird);
      }

      drawMangoBird();
      drawStartText();
      drawEndText();
    }

    function gameLoop() {
      updateGame();
      render();
      requestAnimationFrame(gameLoop);
    }

    function onTap() {
      if (!state.running && !state.over) {
        startAndFly();
      } else if (state.over) {
        startAndFly();
      } else {
        flap();
      }
    }

    startBtn.addEventListener("click", startAndFly);
    restartBtn.addEventListener("click", startAndFly);

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      onTap();
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      onTap();
    }, { passive: false });

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        onTap();
      }
    });

    resetGame();
    gameLoop();
  </script>
</body>
</html>
