<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mango Bird</title>

  <style>
    :root {
      --bg: #090909;
      --panel: #121212;
      --panel-2: #181818;
      --line: #2a2a2a;
      --text: #f7f7f7;
      --muted: #b8b8b8;
      --orange: #ff7b00;
      --gold: #ffbd59;
      --green: #14f195;
      --purple: #9945ff;
      --red: #ff5d5d;
      --sky1: #1e2438;
      --sky2: #111827;
      --grass: #123d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(153, 69, 255, 0.18), transparent 28%),
        linear-gradient(180deg, #0a0a0a, #050505 70%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .wrap {
      width: min(94vw, 560px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 0 6px;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .brand span {
      color: var(--orange);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 800;
      transition: transform 0.15s ease, opacity 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .home-btn {
      color: white;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      padding: 10px 14px;
      font-size: 0.9rem;
    }

    .game-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.42);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, var(--sky1), var(--sky2) 55%, #14221b);
      border-bottom: 1px solid var(--line);
      touch-action: manipulation;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0c0c0c;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
      font-size: 0.95rem;
    }

    .score-box {
      color: var(--green);
    }

    .best-box {
      color: #dfe7ef;
    }

    .controls {
      display: flex;
      gap: 10px;
      padding: 14px 12px 12px;
      background: #0b0b0b;
    }

    .control-btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
    }

    .start-btn {
      background: linear-gradient(90deg, var(--orange), var(--gold));
      color: white;
    }

    .restart-btn {
      background: linear-gradient(90deg, var(--purple), var(--green));
      color: white;
    }

    .donate-banner {
      margin-top: 14px;
      background: rgba(17,17,17,0.94);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px 12px;
      text-align: center;
      box-shadow: 0 18px 32px rgba(0,0,0,0.25);
    }

    .donate-banner p {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 10px;
    }

    .donate-banner a {
      display: inline-block;
      width: 100%;
      background: linear-gradient(90deg, var(--purple), var(--green));
      color: white;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .controls {
        flex-direction: column;
      }

      .brand {
        font-size: 1rem;
      }

      .topbar {
        align-items: flex-start;
      }

      .nav-buttons {
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Mango <span>Bird</span></div>

      <div class="nav-buttons">
        <a href="index.html" class="btn home-btn">← Home</a>
      </div>
    </div>

    <div class="game-shell">
      <canvas id="gameCanvas" width="420" height="620" aria-label="Mango Bird game"></canvas>

      <div class="hud">
        <div class="score-box">Score: <span id="scoreValue">0</span></div>
        <div class="best-box">High: <span id="bestValue">0</span></div>
      </div>

      <div class="controls">
        <button class="btn control-btn start-btn" id="startBtn">Start</button>
        <button class="btn control-btn restart-btn" id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="donate-banner">
      <p>Support The Red Mango community</p>
      <a href="index.html#wallet">💚 Donate SOL</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreValue = document.getElementById("scoreValue");
    const bestValue = document.getElementById("bestValue");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    const BEST_KEY = "redMangoBirdBest";
    const HIGH_SCORE = Number(localStorage.getItem(BEST_KEY)) || 0;
    bestValue.textContent = HIGH_SCORE;

    const state = {
      running: false,
      over: false,
      score: 0,
      best: HIGH_SCORE,
      gravity: 0.48,
      lift: -7.8,
      birdX: 110,
      birdY: 220,
      birdRadius: 18,
      velocity: 0,
      pipeWidth: 64,
      pipeGap: 165,
      pipeSpeed: 2.8,
      pipes: [],
      spawnTimer: 0,
      groundY: canvas.height - 78,
      cloudOffset: 0,
      flashTimer: 0
    };

    function resetGame() {
      state.running = false;
      state.over = false;
      state.score = 0;
      state.birdY = 220;
      state.velocity = 0;
      state.pipes = [];
      state.spawnTimer = 0;
      state.cloudOffset = 0;
      state.flashTimer = 0;
      scoreValue.textContent = "0";
    }

    function setBestScore() {
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(BEST_KEY, String(state.best));
        bestValue.textContent = state.best;
      }
    }

    function flap() {
      if (state.over) return;

      if (!state.running) {
        state.running = true;
      }

      state.velocity = state.lift;
    }

    function startFromScratch() {
      resetGame();
      state.running = true;
      flap();
    }

    function createPipe() {
      const minTop = 80;
      const maxTop = state.groundY - state.pipeGap - 120;
      const topHeight = minTop + Math.random() * (maxTop - minTop);

      state.pipes.push({
        x: canvas.width + 20,
        w: state.pipeWidth,
        gap: state.pipeGap,
        topHeight,
        passed: false
      });
    }

    function updateGame() {
      if (!state.running || state.over) return;

      state.velocity += state.gravity;
      state.birdY += state.velocity;

      state.spawnTimer += 1;
      if (state.spawnTimer >= 95) {
        createPipe();
        state.spawnTimer = 0;
      }

      for (const pipe of state.pipes) {
        pipe.x -= state.pipeSpeed;

        if (!pipe.passed && pipe.x + pipe.w < state.birdX) {
          pipe.passed = true;
          state.score += 1;
          scoreValue.textContent = state.score;
          setBestScore();
        }
      }

      state.pipes = state.pipes.filter(pipe => pipe.x + pipe.w > -20);

      const birdLeft = state.birdX - state.birdRadius;
      const birdRight = state.birdX + state.birdRadius;
      const birdTop = state.birdY - state.birdRadius;
      const birdBottom = state.birdY + state.birdRadius;

      for (const pipe of state.pipes) {
        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipe.w;
        const pipeTopBottom = pipe.topHeight;
        const pipeBottomTop = pipe.topHeight + pipe.gap;

        const intersectsX = birdRight > pipeLeft && birdLeft < pipeRight;
        const intersectsTop = birdTop < pipeTopBottom;
        const intersectsBottom = birdBottom > pipeBottomTop;

        if (intersectsX && (intersectsTop || intersectsBottom)) {
          state.over = true;
          state.running = false;
          setBestScore();
          break;
        }
      }

      if (state.birdY + state.birdRadius >= state.groundY || state.birdY - state.birdRadius <= 0) {
        state.over = true;
        state.running = false;
        setBestScore();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#1c2640");
      sky.addColorStop(0.42, "#202b3d");
      sky.addColorStop(1, "#10201c");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // sun
      ctx.fillStyle = "rgba(255, 191, 94, 0.9)";
      ctx.beginPath();
      ctx.arc(canvas.width - 70, 70, 38, 0, Math.PI * 2);
      ctx.fill();

      // clouds
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      for (let i = 0; i < 8; i++) {
        const x = ((i * 80) - (state.cloudOffset % 80)) + 20;
        const y = 55 + ((i * 17) % 70);
