<style>
:root{--bg:#0d1016;--s1:#151a23;--s2:#1b212c;--bd:#283040;--tx:#e9edf3;--mu:#8e98a8;--ac:#f0a830}

.hidden{display:none!important}
header{position:relative;text-align:center;padding:calc(16px + env(safe-area-inset-top)) 14px 6px}
h1{font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}

.stats{display:flex;justify-content:center;gap:10px;margin:12px 10px 6px}
.stat{flex:1;max-width:130px;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-weight:700;font-size:17px}

.tab{flex:1;display:block;background:none;border:0;border-top:2px solid transparent;padding:14px 4px;font-size:13px;font-weight:600;color:var(--mu);text-align:center;text-decoration:none}
.tab.on{color:var(--tx);border-top-color:var(--ac)}
main{width:min(900px,94%);margin:10px auto;padding-bottom:84px}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
h3{font-size:16px}.muted{color:var(--mu);font-size:13px}
.btn{display:inline-block;border:0;border-radius:8px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;text-align:center}
.btn:active{opacity:.85}
.pri{background:var(--ac);color:#1a1205}.sec{background:var(--s2);border:1px solid var(--bd);color:var(--tx)}
.stage{position:relative;max-width:420px;margin:0 auto}
canvas{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--bd);touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,12,18,.92);border-radius:10px;text-align:center;padding:16px}
.ov h2{margin:0}.ov .big{font-size:60px;font-weight:800;line-height:1}
.nb{color:var(--ac);font-weight:700;font-size:12px;letter-spacing:.2em}
.abtn{display:block;width:min(420px,100%);margin:10px auto 0;padding:14px;font-size:14px;font-weight:700;border:1px solid var(--bd);border-radius:8px;color:var(--tx);background:linear-gradient(90deg,#2b3a52 var(--pg,100%),var(--s2) var(--pg,100%))}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;align-items:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.card.eq{outline:2px solid var(--ac)}
.pw{height:96px;display:flex;align-items:center;justify-content:center}
.por{width:96px;height:96px;object-fit:contain}.lkd{filter:brightness(0) opacity(.3)}
.nm{font-weight:700;font-size:13px}.card p{font-size:11px;color:var(--mu);min-height:30px;margin-top:2px}
.card .btn{width:100%;padding:8px;font-size:12px;margin-top:6px}
.r{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.Common{color:#8e98a8}.Rare{color:#4a9be0}.Epic{color:#9b7be0}.Legendary{color:#e0a030}.Mythical{color:#d05a9a}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pack{background:var(--s2);border:1px solid var(--bd);border-top:3px solid var(--rc);border-radius:10px;padding:16px;text-align:center}
.pa{width:64px;height:64px;margin:4px auto 10px;position:relative}
.pa i{position:absolute;inset:10px;border:2px solid var(--rc);transform:rotate(45deg);border-radius:6px;background:color-mix(in srgb,var(--rc) 20%,transparent)}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px;text-align:left;margin:10px 0}
.modal{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;background:rgba(8,10,14,.96)}
.spin{width:min(640px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.mt{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--mu)}
.shell{position:relative;overflow:hidden;width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px 0}
.wheel{display:flex;gap:10px;width:max-content}
.wi{width:100px;height:128px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s2);border:1px solid;border-radius:8px;font-size:11px;text-align:center}
.wi .por{width:72px;height:72px}
.ptr{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--ac);z-index:2}
.rev{width:min(400px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px 16px;text-align:center;margin:0 auto}
.rev .por{width:160px;height:160px;animation:pop .35s ease-out}.rev .pv{width:140px;height:140px}
.rev h2{margin:6px 0 0}.rev p{color:var(--mu);font-size:13px;margin:6px 0}

#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;padding:0 12px 20px;color:var(--mu);font-size:12px}footer a{color:var(--tx);margin:0 8px;text-decoration:none}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">← Home</a>
  <h1>Mango Bird<b>DX</b></h1>
  <div class="stats">
    <div class="stat"><small>Coins</small><span id="coins">0</span></div>

    <button class="btn sec" id="skip">Skip</button></div>
  <div id="rev" class="rev hidden"></div>
</div>
<div id="toast"></div>
<script>
"use strict";
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;

.split(";").map((s,i)=>{const[x,r,p]=s.split("|"),k=x.indexOf(" ");return{id:i,e:x.slice(0,k),n:x.slice(k+1),r:"",p}});

const PACKS=[
 {id:"b",n:"Fruit Crate",e:"",price:100,ch:{Common:70,Rare:22,Epic:7,Legendary:1,Mythical:0}},
 {id:"g",n:"Golden Pack",e:"",price:300,ch:{Common:35,Rare:35,Epic:20,Legendary:9,Mythical:1}},
 {id:"c",n:"Cosmic Pack",e:"",price:800,ch:{Common:10,Rare:25,Epic:35,Legendary:25,Mythical:5}}];

/* ---------- save ---------- */
const KEY="mangoBirdDX_save_v3";
let save={points:0,best:0,unlocked:[0],equipped:0,pity:0,day:"",streak:0,bio:0};

if(!save.unlocked.includes(save.equipped))save.equipped=0;

const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const eq=()=>SK[save.equipped];
const HUES="36,48,80,350,225,135,28,15,52,45,150,355,200,190,100,40,210,10,250,160,320,55,270,260,185,330,200,280,0,210,45,15,235,275,0,270,300,25,50,290".split(",").map(Number),RB=[28,34,39];
const hue=s=>s.id===0?"#ffb02e":`hsl(${HUES[s.id]},80%,58%)`;
function pal(s,t){if(s.id===0)return{a:"#ffb52e",b:"#e8720c",c:"#fff0b8",w:"#d95f0a"};
 const h=RB.includes(s.id)?(t*2)%360:HUES[s.id],dk=s.id===27||s.id===36,sa=s.id===16?30:s.id===6?38:82,L=dk?30:58;
 return{a:`hsl(${h},${sa}%,${L+6}%)`,b:`hsl(${(h+25)%360},${sa}%,${L-16}%)`,c:`hsl(${h},${Math.min(sa,70)}%,${dk?52:88}%)`,w:`hsl(${(h+40)%360},${sa}%,${L-4}%)`}}

const ACC="leaf,flower,cap,leaf,beanie,stripes,band,flower,spikes,shades,phones,antenna,scarf,beanie,spots,flame,halo,flame,star,phones,spots,bolt,mask,wiz,antenna,horns,gem,bat,star,helm,crown,flame,bolt,star,gem,horns,helm,flame,gem,bat".split(",");
function drawAcc(c,k,P,t){c.save();const f=x=>{c.fillStyle=x},poly=a=>{c.beginPath();c.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.closePath();c.fill()},dot=(x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fill()};
 if(k==="leaf"){f("#2fd37a");c.beginPath();c.moveTo(2,-15);c.quadraticCurveTo(8,-29,20,-22);c.quadraticCurveTo(10,-14,2,-15);c.fill()}
 else if(k==="flower"){for(let i=0;i<5;i++){f(i%2?"#ff7bb0":"#ffd1e6");dot(6+Math.cos(i*1.26)*5,-20+Math.sin(i*1.26)*5,3.3)}f("#ffd34e");dot(6,-20,2.6)}
 else if(k==="cap"){f(P.b);c.beginPath();c.arc(4,-10,12.5,Math.PI,TAU);c.fill();c.fillRect(6,-11,17,3.5);f("rgba(255,255,255,.45)");dot(4,-17,2.6)}
 else if(k==="beanie"){f("#f2f6ff");c.beginPath();c.arc(3,-10,12.5,Math.PI,TAU);c.fill();f(P.a);c.fillRect(-9.5,-12,25,4);f("#fff");dot(3,-24,4)}
 else if(k==="stripes"){c.strokeStyle=P.b;c.lineWidth=3;c.globalAlpha=.55;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*7-3,-14);c.quadraticCurveTo(i*7+3,0,i*7-3,14);c.stroke()}}
 else if(k==="band"){f("#e8453c");c.fillRect(-12,-11,27,5);poly([-12,-9,-24,-3,-19,-12])}
 else if(k==="spikes"){f("#38c66a");for(let i=0;i<3;i++)poly([i*7-6,-14,i*7-2,-28,i*7+2,-14])}
 else if(k==="shades"){f("#111");c.fillRect(1,-10,17,6.5);f("rgba(140,210,255,.7)");c.fillRect(3,-9,5,2)}
 else if(k==="phones"){c.strokeStyle="#222";c.lineWidth=3;c.beginPath();c.arc(0,-2,16,Math.PI*1.05,Math.PI*1.8);c.stroke();f(P.a);dot(-11,-8,4.5)}
 else if(k==="antenna"){c.strokeStyle="#444";c.lineWidth=2;c.beginPath();c.moveTo(2,-15);c.lineTo(-3,-29);c.stroke();f("#ff5f7a");dot(-3,-30,3.4)}
 else if(k==="scarf"){f("#e8453c");c.beginPath();c.ellipse(8,7,6,3.4,.8,0,TAU);c.fill();poly([4,8,-9,15,-5,6])}
 else if(k==="spots"){f("rgba(255,255,255,.42)");[[-6,-6,3],[2,9,2.5],[-12,5,2.6],[11,2,2]].forEach(a=>dot(a[0],a[1],a[2]))}
 else if(k==="flame"){f("#ff7a1a");poly([-6,-14,-5,-30,1,-18,5,-32,9,-17,15,-27,14,-13]);f("#ffd34e");poly([-1,-14,1,-24,4,-14])}
 else if(k==="halo"){c.strokeStyle="#fff6a8";c.lineWidth=2.5;c.beginPath();c.ellipse(3,-24,10,3.2,0,0,TAU);c.stroke()}
 else if(k==="star"){f("#ffe14d");star(c,-2,4,6.5)}
 else if(k==="bolt"){f("#ffe14d");poly([0,-4,-6,5,-1,5,-4,13,6,0,1,0,4,-4])}
 else if(k==="mask"){f("#161426");c.beginPath();c.ellipse(5,-5,13,6.5,0,0,TAU);c.fill();f("#fff");dot(8,-5,3.6);f("#000");dot(9,-5,1.8)}
 else if(k==="wiz"){f("#5b34c9");poly([-6,-14,4,-36,16,-13]);f("#ffd34e");c.fillRect(-9,-15,28,3.5);star(c,5,-23,3)}
 else if(k==="horns"){f("#efe6cf");poly([-3,-14,-6,-27,4,-15]);poly([8,-15,14,-27,15,-13])}
 else if(k==="gem"){f("#7ef6ff");poly([6,-21,11,-15,6,-9,1,-15]);f("#fff");c.fillRect(5,-18,2,3)}
 else if(k==="bat"){f("#2a1a40");poly([-6,-4,-30,-17,-24,-5,-31,6,-20,4,-14,11,-6,6])}
 else if(k==="helm"){f("#b8c0d6");c.beginPath();c.arc(3,-7,14,Math.PI,TAU);c.fill();f("#222");c.fillRect(2,-9,15,2.6);f(P.a);c.beginPath();c.ellipse(-4,-22,3,7,-.5,0,TAU);c.fill()}
 else if(k==="crown"){f("#ffd34e");poly([-5,-14,-7,-27,-1,-20,4,-29,9,-20,15,-27,13,-14])}
 c.restore()}
function sprite(c,s,t,vy){const P=pal(s,t),ri=RO.indexOf(s.r),fl=Math.sin(t*.45+(vy<0?0:1.5))*.7,gl=ri===4?`hsl(${(t*3)%360},100%,65%)`:RC[s.r];
 c.save();if(ri>=1){c.shadowColor=gl;c.shadowBlur=2+ri*2}
 c.fillStyle=P.b;for(const a of[-.5,0,.5]){c.save();c.translate(-15,2);c.rotate(Math.PI+a*.7);c.beginPath();c.ellipse(9,0,10,3.5,0,0,TAU);c.fill();c.restore()}
 const g=c.createRadialGradient(-5,-7,2,0,0,22);g.addColorStop(0,P.c);g.addColorStop(.3,P.a);g.addColorStop(1,P.b);c.fillStyle=g;c.beginPath();c.ellipse(0,0,19,16,0,0,TAU);c.fill();c.restore();
 const ga=c.globalAlpha;c.fillStyle=P.c;c.globalAlpha=ga*.85;c.beginPath();c.ellipse(3,7,12,7,.15,0,TAU);c.fill();c.globalAlpha=ga;
 c.fillStyle=ri>=3?"#ffd34e":P.b;const cr=ri>=3?4:ri>=2?3:2;for(let i=0;i<cr;i++){c.save();c.translate(-2+i*5,-14);c.rotate(-.4+i*.35+Math.sin(t*.1+i)*.08);c.beginPath();c.ellipse(0,-6,3,ri>=3?9:7,0,0,TAU);c.fill();c.restore()}
 c.save();c.translate(-5,3);c.rotate(fl);c.fillStyle=P.w;c.beginPath();c.moveTo(0,-5);c.quadraticCurveTo(-20,-8,-24,6);c.quadraticCurveTo(-10,10,0,6);c.fill();c.strokeStyle="rgba(255,255,255,.4)";c.lineWidth=1.2;c.beginPath();c.moveTo(-4,-1);c.lineTo(-18,3);c.moveTo(-3,2);c.lineTo(-15,6);c.stroke();c.restore();
 c.fillStyle="#fff";c.beginPath();c.arc(8,-5,6,0,TAU);c.fill();c.fillStyle=ri>=2?RC[s.r]:"#3a2415";c.beginPath();c.arc(9.3,-5,3.9,0,TAU);c.fill();c.fillStyle="#000";c.beginPath();c.arc(9.8,-5,2,0,TAU);c.fill();c.fillStyle="#fff";c.beginPath();c.arc(10.6,-6.4,1.2,0,TAU);c.fill();
 c.fillStyle="rgba(255,90,120,.3)";c.beginPath();c.arc(5,3,3.2,0,TAU);c.fill();
 c.fillStyle="#ffc24a";c.beginPath();c.moveTo(16,-2.5);c.lineTo(29,2);c.lineTo(16,3);c.fill();c.fillStyle="#ff8f2e";c.beginPath();c.moveTo(16,3);c.lineTo(27,3.5);c.lineTo(16,8);c.fill();
 drawAcc(c,ACC[s.id],P,t);
 if(ri===4){c.save();c.strokeStyle="#fff6a8";c.lineWidth=2.5;c.shadowColor="#fff6a8";c.shadowBlur=8;c.beginPath();c.ellipse(2,-28,11,3.6,0,0,TAU);c.stroke();c.restore()}
 c.fillStyle="#fff";for(let i=0;i<ri-1;i++){const a=t*.05+i*TAU/(ri-1);star(c,Math.cos(a)*27,Math.sin(a)*22,3)}}
const POR={};function por(id){if(POR[id])return POR[id];const s=SK[id],c=document.createElement("canvas");c.width=c.height=240;const x=c.getContext("2d"),g=x.createRadialGradient(120,125,8,120,125,110);g.addColorStop(0,RC[s.r]+"33");g.addColorStop(1,RC[s.r]+"00");x.fillStyle=g;x.fillRect(0,0,240,240);x.translate(112,132);x.scale(3.2,3.2);sprite(x,s,id*37,-1);return POR[id]=c.toDataURL()}

 if(ni!==G.bi){G.bi=ni;pop(BM[ni].n.toUpperCase(),W/2,200,"#fff",30,110);beep(500,.4,"triangle",.06,500);G.flash=5;
  if(ni>save.bio){save.bio=ni;persist();bioUI();pop("NEW BIOME UNLOCKED!",W/2,236,"#ffd34e",16,110)}}
 for(const h of G.hz){h.x-=sp;h.x+=h.vx*f;h.y+=h.vy*f;if(h.k==="drip")h.vy+=.1*f;if(h.k==="wave")h.y=h.y0+Math.sin(G.t*.07+h.ph)*55}
 G.hz=G.hz.filter(h=>h.x>-40&&h.y<GY+10);
 const mag=p==="mag"?110:0;
 for(const c of G.cn){c.x-=sp;const dx=G.bx-c.x,dy=G.by-c.y,d=Math.hypot(dx,dy);
  if(mag&&!c.sh&&d<mag){c.x+=dx*.12;c.y+=dy*.12}
  if(d<26){c.x=-999;if(c.sh){G.shield++;pop("SHIELD!",G.bx,G.by-30,"#7ef6ff");beep(880,.25,"triangle",.06,500)}
   else{const v=(1+(G.combo/3|0))*(G.x2>0?2:1);G.coins+=v;pop("+"+v,c.x<0?G.bx:G.bx+20,G.by-24,"#ffd34e");beep(1200,.07,"square",.03);burst(G.bx+10,G.by,4,["#ffd34e"],2.5)}}}
 G.pipes=G.pipes.filter(q=>q.x>-80);G.cn=G.cn.filter(c=>c.x>-30);
 for(const q of G.pipes){const gt=gapTop(q),gb=gt+q.gap;if(G.bx+12>q.x&&G.bx-12<q.x+PW&&(G.by-12<gt||G.by+12>gb)){hit();if(G.mode!=="play")return}}
 for(const h of G.hz){if(Math.hypot(h.x-G.bx,h.y-G.by)<h.r+10){hit();if(G.mode!=="play")return}}
 if(G.by+12>=GY){G.by=GY-14;hit();if(G.mode==="play")G.vy=-6}
 if(G.by-12<=0){G.by=12;G.vy=1}
 if(G.t%8===0)abUI()}
function step(){G.t++;const z=bt(BM[G.bi]);for(let i=0;i<3;i++)for(let j=0;j<3;j++)cur[i][j]+=(z[i][j]-cur[i][j])*.03;
 if(G.mode==="play")stepPlay();else if(G.mode==="ready"){G.scroll+=.6;G.vy=0}else G.scroll+=0;
 for(const q of G.parts){q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.l++}G.parts=G.parts.filter(q=>q.l<q.m);
 for(const q of G.pops){q.y-=q.s>20?.1:.8;q.l++}G.pops=G.pops.filter(q=>q.l<q.m);G.shake*=.9;if(G.flash>0)G.flash--;ambStep()}

/* ---------- drawing ---------- */
function ridge(base,amp,sp,f,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W;x+=10){const u=(x+G.scroll*sp)/f;ctx.lineTo(x,base-amp*Math.sin(u)-amp*.5*Math.sin(u*2.3))}ctx.lineTo(W,GY);ctx.fill()}
function drawBG(){const b=B(),g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,rgb(cur[0]));g.addColorStop(1,rgb(cur[1]));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(b.st)for(const q of STARS){ctx.globalAlpha=.25+.5*Math.sin(G.t/20+q.p);ctx.fillStyle="#fff";ctx.fillRect(q.x,q.y,2,2)}ctx.globalAlpha=1;
 if(b.sn){const sg=ctx.createRadialGradient(290,90,4,290,90,70);sg.addColorStop(0,b.sn);sg.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=sg;ctx.fillRect(210,10,160,160)}
 ctx.fillStyle=b.cc;for(let i=0;i<5;i++){const x=((((i*155-G.scroll*.3*(1+i%3*.3))%700)+700)%700)-60,y=70+(i%3)*48;ctx.beginPath();ctx.arc(x,y,20,0,TAU);ctx.arc(x+22,y-10,25,0,TAU);ctx.arc(x+47,y,18,0,TAU);ctx.fill()}
 ridge(GY-30,22,.12,60,"rgba(0,0,0,.14)");ridge(GY-10,14,.3,40,"rgba(0,0,0,.24)")}
function drawGround(){const b=B();ctx.fillStyle=rgb(cur[2]);ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(0,GY,W,5);ctx.fillStyle="rgba(0,0,0,.2)";
 const o=-(G.scroll%24);for(let x=o;x<W+24;x+=24)ctx.fillRect(x,GY+16,14,5);
 if(b.gb){ctx.fillStyle=b.gb;for(let i=0;i<7;i++){const x=((i*61-G.scroll*.5)%W+W)%W;ctx.beginPath();ctx.arc(x,GY+10+(i%2)*14,3+(i%3)*1.5+Math.sin(G.t/9+i)*1.2,0,TAU);ctx.fill()}}}
function drawPipe(q){const b=BM[q.b],gt=gapTop(q),gb=gt+q.gap;if(b.pd==="glow"){ctx.shadowColor=b.p[2];ctx.shadowBlur=5}
 const seg=(x,y,w,h)=>{const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,b.p[1]);g.addColorStop(.35,b.p[2]);g.addColorStop(1,b.p[1]);ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.strokeStyle=b.p[0];ctx.lineWidth=2.5;ctx.strokeRect(x,y,w,h);
  if(b.pd==="rust"){ctx.fillStyle="rgba(120,50,10,.5)";for(let k=0;k<4;k++)ctx.fillRect(x+4+k*11,y+(((k*37+(x|0))%Math.max(8,(h|0)-14))+Math.max(8,(h|0)-14))%Math.max(8,(h|0)-14),4,14);ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(x,y+h*.5,w,3)}
  if(b.pd==="rivet"){ctx.fillStyle=b.p[0];for(let yy=y+8;yy<y+h-4;yy+=22){ctx.beginPath();ctx.arc(x+8,yy,2.4,0,TAU);ctx.arc(x+w-8,yy,2.4,0,TAU);ctx.fill()}}
  if(b.pd==="stripe"){ctx.fillStyle="rgba(255,255,255,.55)";for(let yy=y;yy<y+h;yy+=18)ctx.fillRect(x,yy,w,8)}
  if(b.pd==="glow"){ctx.strokeStyle=b.p[2];ctx.lineWidth=1;ctx.strokeRect(x+4,y+4,w-8,h-8)}
  if(b.pd==="vine"){ctx.strokeStyle="#7ee06a";ctx.lineWidth=3;ctx.beginPath();for(let yy=y;yy<y+h;yy+=4)ctx.lineTo(x+w/2+Math.sin(yy*.12)*(w/2-6),yy);ctx.stroke()}
  if(b.pd==="ice"){ctx.fillStyle="rgba(255,255,255,.45)";ctx.fillRect(x+6,y,4,h)}};
 seg(q.x,0,PW,gt-16);seg(q.x,gb+16,PW,GY-gb-16);seg(q.x-5,gt-16,PW+10,16);seg(q.x-5,gb,PW+10,16);ctx.shadowBlur=0;
 if(b.sl){ctx.fillStyle=b.sl;for(const dx of[8,30]){ctx.beginPath();ctx.arc(q.x+dx,gt+6+Math.sin(G.t/9+dx)*4,4,0,TAU);ctx.fillRect(q.x+dx-4,gt,8,6+Math.sin(G.t/9+dx)*4);ctx.fill()}ctx.beginPath();ctx.ellipse(q.x+PW/2,gb+1,PW/2+3,5,0,Math.PI,TAU);ctx.fill()}}
function drawCoin(c,i){if(c.x<-50)return;if(c.sh){const p=1+Math.sin(G.t/6)*.15;const g=ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,16*p);g.addColorStop(0,"#fff");g.addColorStop(.5,"#7ef6ff");g.addColorStop(1,"rgba(126,246,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,16*p,0,TAU);ctx.fill();return}
 const w=Math.abs(Math.cos(G.t/10+i))*9+2;ctx.fillStyle="#ffd34e";ctx.shadowColor="#ffb02e";ctx.shadowBlur=2;ctx.beginPath();ctx.ellipse(c.x,c.y,w,10,0,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff3a8";ctx.fillRect(c.x-1,c.y-5,2,10)}
function drawBird(){const bob=G.mode==="ready"?Math.sin(G.t/12)*7:0;ctx.save();ctx.translate(G.bx,G.by+bob);ctx.rotate(Math.max(-.5,Math.min(1,G.vy/10)));
 if(G.inv>0&&G.t%6<3)ctx.globalAlpha=.4;if(G.dash>0){ctx.fillStyle="rgba(255,255,255,.5)";ctx.fillRect(-60,-6,50,12)}
 sprite(ctx,eq(),G.t,G.vy);ctx.restore();
 if(G.shield>0){ctx.strokeStyle=`rgba(126,246,255,${.6+Math.sin(G.t/5)*.3})`;ctx.fillStyle="rgba(126,246,255,.15)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(G.bx,G.by+bob,28,0,TAU);ctx.fill();ctx.stroke()}}
function txt(t,x,y,size,fill,al){ctx.textAlign=al||"center";ctx.font=`900 ${size}px system-ui,-apple-system,Arial`;ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,.55)";ctx.strokeText(t,x,y);ctx.fillStyle=fill;ctx.fillText(t,x,y)}
function render(){ctx.save();if(G.shake>.3)ctx.translate(R(-1,1)*G.shake,R(-1,1)*G.shake);
 drawBG();for(const q of G.pipes)drawPipe(q);drawGround();G.hz.forEach(drawHz);G.cn.forEach(drawCoin);if(G.mode!=="over")drawBird();drawAmb();
 for(const q of G.parts){ctx.globalAlpha=Math.max(0,1-q.l/q.m);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
 for(const q of G.pops){ctx.globalAlpha=Math.max(0,Math.min(1,(q.m-q.l)/25));txt(q.t,q.x,q.y,q.s,q.c)}ctx.globalAlpha=1;
 if(G.flash>0){ctx.fillStyle=`rgba(255,255,255,${G.flash/10})`;ctx.fillRect(0,0,W,H)}
 ctx.restore();
 if(G.mode==="play"){txt(G.score,W/2,86,56,"#fff");if(G.combo>=3)txt("COMBO x"+(1+(G.combo/3|0)),W/2,114,20,"#ffd34e");
  txt("COINS "+G.coins,12,28,16,"#ffd34e","left");txt(B().n,12,52,13,"#fff","left");if(G.shield>0)txt("SHIELD x"+G.shield,W-10,28,14,"#7ef6ff","right");
  const st=G.slow>0?"SLOW TIME":G.x2>0?"DOUBLE COINS":G.dash>0?"PHASE DASH":"";if(st)txt(st,W/2,140,16,"#ff6be0")}
 else if(G.mode==="ready"){txt("MANGO BIRD DX",W/2,150,32,"#ffd34e");if(G.t%60<40)txt("TAP TO FLY",W/2,200,22,"#fff");txt(eq().n,W/2,GY-4,15,"#fff")}}

/* ---------- loop (fixed 60 steps/sec) + input ---------- */
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(50,now-last);last=now;
 if(!$("play").classList.contains("hidden")){while(acc>=16.667){step();acc-=16.667}render()}else acc=0;
 requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",e=>{e.preventDefault();flap()});
$("ab").onclick=useAbility;
document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();flap()}if(e.code==="KeyA"||e.code==="ShiftLeft")useAbility()});
stats();dailyUI();abUI();bioUI();requestAnimationFrame(loop);
</script>
