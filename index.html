<div class="modal" id="donateModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Donate SOL</h3>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>

    <input id="donationInput" type="number" min="0.01" step="0.01" placeholder="Amount in SOL" />

    <div class="modal-actions">
      <button class="modal-cancel" id="cancelModalBtn" type="button">Cancel</button>
      <button class="modal-confirm" id="sendViaPhantomBtn" type="button">Send via Phantom</button>
    </div>
  </div>
</div>
