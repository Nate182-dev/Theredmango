<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Red Mango | Solana Community Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#06070a;
      --bg-2:#0d1117;
      --panel:#10141a;
      --panel-2:#161b22;
      --panel-3:#1b222b;
      --line:#272d35;
      --text:#f3f6f9;
      --muted:#a8afb9;
      --soft:#7d8793;
      --orange:#ff7b00;
      --gold:#ffb347;
      --purple:#9945FF;
      --green:#14F195;
      --green-2:#3ae6a6;
      --red:#ff6262;
      --shadow:rgba(0,0,0,0.28);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:
        radial-gradient(circle at top left, rgba(153,69,255,0.14), transparent 26%),
        radial-gradient(circle at bottom right, rgba(20,241,149,0.10), transparent 22%),
        var(--bg);
      color:var(--text);
      line-height:1.6;
    }

    a{
      text-decoration:none;
    }

    .container{
      max-width:1150px;
      margin:0 auto;
      padding:20px 20px 80px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:10px 0 28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      background:linear-gradient(135deg, rgba(255,123,0,0.15), rgba(153,69,255,0.18));
      border:1px solid rgba(255,255,255,0.06);
    }

    .brand-text h2{
      font-size:1.1rem;
      font-weight:800;
      letter-spacing:-0.02em;
    }

    .brand-text p{
      font-size:0.72rem;
      color:var(--muted);
      letter-spacing:0.07em;
      text-transform:uppercase;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:22px;
      flex-wrap:wrap;
    }

    .nav a{
      color:#d2d8df;
      font-size:0.92rem;
      transition:0.2s ease;
    }

    .nav a:hover{
      color:var(--text);
    }

    .wallet-btn{
      background:linear-gradient(90deg, var(--purple), var(--green));
      color:white;
      border:none;
      border-radius:12px;
      padding:11px 16px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 14px 26px rgba(153,69,255,0.2);
    }

    .hero{
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:28px;
      padding:28px 0 18px;
      align-items:center;
    }

    .hero-copy h1{
      font-size:clamp(2.7rem, 5vw, 5rem);
      line-height:0.95;
      letter-spacing:-0.07em;
      margin-bottom:18px;
      font-weight:900;
    }

    .gradient{
      background:linear-gradient(90deg, var(--orange), var(--gold));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-copy p{
      color:var(--muted);
      font-size:1.08rem;
      max-width:620px;
      margin-bottom:24px;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:14px;
      margin-bottom:26px;
    }

    .primary-btn,
    .secondary-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:16px 24px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
      transition:transform .15s ease;
      border:none;
    }

    .primary-btn{
      background:linear-gradient(90deg, var(--purple), var(--green));
      color:white;
      box-shadow:0 18px 36px rgba(153,69,255,0.25);
    }

    .secondary-btn{
      border:1px solid var(--line);
      background:rgba(255,255,255,0.02);
      color:var(--text);
    }

    .primary-btn:hover,
    .secondary-btn:hover{
      transform:translateY(-1px);
    }

    .stats{
      display:flex;
      flex-wrap:wrap;
      gap:18px;
    }

    .stat{
      min-width:140px;
      background:rgba(255,255,255,0.02);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 16px;
    }

    .stat .label{
      color:var(--soft);
      font-size:0.72rem;
      text-transform:uppercase;
      letter-spacing:0.08em;
      margin-bottom:4px;
    }

    .stat .value{
      font-size:1.4rem;
      font-weight:800;
      color:var(--text);
    }

    .hero-card{
      background:linear-gradient(180deg, rgba(17,20,24,0.96), rgba(14,18,24,0.96));
      border:1px solid rgba(255,255,255,0.06);
      border-radius:26px;
      padding:22px;
      box-shadow:0 24px 60px rgba(0,0,0,0.28);
    }
